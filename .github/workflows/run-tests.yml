name: run-tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependency-version: [prefer-lowest, prefer-stable]
    name: Laravel ${{ matrix.laravel }} - PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Resolve matching Laravel and Testbench versions
        run: |
          if [ "${{ matrix.laravel }}" = "12" ]; then testbench=10; else testbench=11; fi
          composer update --with="laravel/framework:^${{ matrix.laravel }}.0" --with="orchestra/testbench-core:^$testbench.0" --${{ matrix.dependency-version }} --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: vendor/bin/phpunit --fail-on-warning --fail-on-risky
